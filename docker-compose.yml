# Drop-in fragment for an existing Sonarr/Jellyfin stack.
#
# The only hard requirement is that sumo-bridge and Sonarr agree on the paths
# under /downloads. If Sonarr mounts them somewhere else, either fix the mount
# here or add a Remote Path Mapping in Sonarr.
#
# Copy .env.example to .env and set SUMO_API_KEY before starting.

services:
  sumo-bridge:
    build: .
    image: sumo-bridge:latest
    container_name: sumo-bridge
    restart: unless-stopped
    environment:
      # Must be reachable *from Sonarr* — this is what the .nzb links point at.
      SUMO_PUBLIC_URL: http://sumo-bridge:8787
      SUMO_API_KEY: ${SUMO_API_KEY:?set SUMO_API_KEY in .env}
      SUMO_CATEGORY: sumo
      SUMO_MAX_CONCURRENT: 1
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ./config:/config
      # Same host path Sonarr sees, so no remote path mapping is needed.
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      # Only needed to reach the UI/health endpoint from outside the compose
      # network; Sonarr talks to it over the network alias.
      - "8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/health').read()",
        ]
      interval: 60s
      timeout: 10s
      start_period: 10s
# If Sonarr and Jellyfin live in another compose project, join their network:
#
# networks:
#   default:
#     name: media
#     external: true
